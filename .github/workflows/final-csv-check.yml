name: final.csv structure check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  final-csv-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Trusted base only. PR trees are read as data, never checked out/executed.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - name: Fetch PR commits
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"
      - name: Check every touched POC final.csv structure
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/check_final_csv.py
      # This does NOT certify geometry or wins. Before merge, separately certify
      # official literal + actual pandas transport, strict wins vs fresh main.
