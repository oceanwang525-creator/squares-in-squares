name: Publish certified merge

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_audit:
        description: Ignore prior evidence and fully certify every unknown group
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: certified-merge
  cancel-in-progress: true

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.2'
      - name: Install pinned official-check dependencies
        run: python -m pip install mpmath==1.4.1 pandas==3.1.0 numpy==2.5.4 requests==2.32.5
      - name: Test guarded publisher
        run: |
          python -m unittest discover -s .github/scripts -p 'test_publish_certified_merge.py'
          python -m unittest discover -s .github/scripts -p 'test_certification_runtime.py'
          python -m unittest discover -s .github/scripts -p 'test_certification_cache.py'
      - name: Union, certify, commit strict gains, then publish exact canonical
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CERT_FULL_AUDIT: ${{ inputs.full_audit && 'true' || 'false' }}
          CERT_EVIDENCE_OUT: ${{ runner.temp }}/squares-cert-evidence
        run: |
          /usr/bin/time -v python -u .github/scripts/publish_certified_merge.py
      - name: Persist trusted official group evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: official-group-evidence-v1
          path: ${{ runner.temp }}/squares-cert-evidence/group-evidence.json
          if-no-files-found: ignore
          retention-days: 30
