name: Publish certified merge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: certified-merge
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned official-check dependencies
        run: python -m pip install mpmath==1.4.1 pandas==3.1.0
      - name: Test guarded publisher
        run: python -m unittest discover -s .github/scripts -p 'test_publish_certified_merge.py'
      - name: Union, certify, commit strict gains, then publish exact canonical
        run: python .github/scripts/publish_certified_merge.py
